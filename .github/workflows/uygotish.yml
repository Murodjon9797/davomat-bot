# Render bepul serveri 15 daqiqa so'rovsiz qolsa uxlaydi va keyingi ochilish 30-60 soniya kutadi.
# Bu workflow har 5 daqiqada serverga so'rov yuborib, uni uyg'oq ushlab turadi.
name: Serverni uyg'oq tutish

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Health so'rovi
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://davomat-bot-4ci8.onrender.com/health || true)
            echo "Javob: $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          exit 1
